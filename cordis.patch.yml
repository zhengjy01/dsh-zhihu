# dsh-zhihu bundle patch: inserts the plugin row into the profile roster.
# Applied as a profile bundle layer (declared by the `dsh.bundle.patch`
# manifest field in package.json). Activate with:
#
#   # local development (link)
#   dsh plugin --profile add <包名>
#   # after publishing to GitHub (repo tagged with the `dsh-plugin` topic)
#   dsh plugin --profile web add github:zhengjy01/dsh-zhihu
- insert:
    - id: zhihu
      name: '@zhengjunyao/dsh-zhihu'
      config:
        announceToAgent: true   # 在系统提示中公告插件（工具 + 能力说明）
        enabled: true           # 插件总开关
        # readOnly 是「首次生效的默认值」：真正的开关存在
        # ~/.dsh/dsh-zhihu.json（用 zhihu_config 改，或用 zhihu_config 的
        # readOnly 参数临时覆盖）。true = 只注册读取类工具。
        readOnly: true
